<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(225,60%,55%)" />
      <stop offset="100%" stop-color="hsl(210,80%,40%)" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(225,55%,65%)" />
      <stop offset="100%" stop-color="hsl(210,70%,45%)" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main fuselage -->
  <path
    d="M10 34 C14 26, 26 22, 38 22 L54 28 C56 29, 56 31, 54 32 L38 36 C26 36, 14 38, 10 30 Z"
    fill="url(#bodyGrad)"
    filter="url(#glow)"
  />

  <!-- Nose cone highlight -->
  <ellipse cx="53" cy="30" rx="3.5" ry="2" fill="hsl(210,90%,75%)" opacity="0.6" />

  <!-- Main left wing -->
  <path
    d="M30 30 L14 48 L22 46 L36 32 Z"
    fill="url(#wingGrad)"
  />

  <!-- Main right wing (upper) -->
  <path
    d="M30 28 L18 14 L24 16 L36 26 Z"
    fill="url(#wingGrad)"
  />

  <!-- Tail fin vertical -->
  <path
    d="M12 30 L10 20 L16 26 Z"
    fill="url(#bodyGrad)"
  />

  <!-- Tail fin horizontal -->
  <path
    d="M12 30 L6 34 L14 33 Z"
    fill="url(#wingGrad)"
  />

  <!-- Engine pod 1 -->
  <ellipse cx="29" cy="40" rx="5" ry="2.2" fill="hsl(225,45%,38%)" />
  <ellipse cx="29" cy="40" rx="3.5" ry="1.4" fill="hsl(210,80%,65%)" opacity="0.5" />

  <!-- Engine pod 2 -->
  <ellipse cx="24" cy="22" rx="4" ry="1.8" fill="hsl(225,45%,38%)" />
  <ellipse cx="24" cy="22" rx="2.8" ry="1.1" fill="hsl(210,80%,65%)" opacity="0.5" />

  <!-- Window row shine -->
  <ellipse cx="44" cy="28.5" rx="2" ry="1" fill="white" opacity="0.45" />
  <ellipse cx="49" cy="29" rx="1.5" ry="0.9" fill="white" opacity="0.35" />
  <ellipse cx="39" cy="28" rx="1.8" ry="0.9" fill="white" opacity="0.35" />

  <!-- Body top highlight -->
  <path
    d="M20 25 C28 22, 40 22, 50 27"
    stroke="white"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.35"
    fill="none"
  />
</svg>
